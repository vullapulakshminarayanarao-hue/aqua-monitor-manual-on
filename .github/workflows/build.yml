name: Build APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Download Gradle
        run: |
          curl -fsSL "https://services.gradle.org/distributions/gradle-8.2-bin.zip" -o /tmp/g.zip
          unzip -q /tmp/g.zip -d /tmp/g
          /tmp/g/gradle-8.2/bin/gradle wrapper --gradle-version=8.2
          chmod +x gradlew
      - run: ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk TrustWaterController.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TrustWaterController-APK
          path: TrustWaterController.apk
          if-no-files-found: error
          retention-days: 30
